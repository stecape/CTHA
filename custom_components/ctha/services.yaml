set_override:
  fields:
    zone_id:
      required: true
      example: 01J8ZQ4P7K3W2X9Y
      selector:
        text:
    temperature:
      required: true
      example: 21.5
      selector:
        number:
          min: 5
          max: 30
          step: 0.5
          unit_of_measurement: "°C"
    policy:
      default: next_slot
      selector:
        select:
          options:
            - next_slot
            - duration
            - until_scenario_change
            - sticky
    duration:
      example: "01:30:00"
      selector:
        duration:

clear_override:
  fields:
    zone_id:
      required: true
      example: 01J8ZQ4P7K3W2X9Y
      selector:
        text:
