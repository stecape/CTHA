name: Release

# Un tag `vX.Y.Z` pubblica la release. Il passo esisteva già ma era a mano, ed
# è esattamente quello che si dimentica: senza release HACS non propone
# l'aggiornamento, perché guarda le release e non il contenuto di `main`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Pubblica la release dal tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # `actions/checkout` porta il commit del tag, non l'oggetto del tag
      # annotato: senza questo fetch il messaggio — cioè le note di rilascio —
      # non esiste sul runner.
      - name: Recupera il messaggio del tag
        run: git fetch --force --tags

      # La versione nel manifest è quella che HACS mostra dopo l'installazione,
      # il tag è quella che usa per decidere se proporre l'aggiornamento: se le
      # due divergono, l'utente aggiorna e si ritrova un numero diverso da
      # quello che ha scelto.
      - name: Il manifest concorda col tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(python3 -c 'import json;print(json.load(open("custom_components/ctha/manifest.json"))["version"])')"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::Il tag è $GITHUB_REF_NAME ma manifest.json dice $manifest. Allineali prima di taggare."
            exit 1
          fi

      # Le note stanno nel messaggio del tag annotato: prima riga il titolo, il
      # resto il corpo. Scriverle al momento del tag tiene il racconto della
      # versione attaccato alla versione, invece che in un campo da riempire
      # dopo averla già pubblicata.
      - name: Crea la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          message="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"
          title="$(printf '%s\n' "$message" | head -1)"
          body="$(printf '%s\n' "$message" | tail -n +2)"

          if [ -z "$title" ]; then
            echo "::error::Il tag $GITHUB_REF_NAME non ha un messaggio: serve un tag annotato (git tag -a)."
            exit 1
          fi

          printf '%s\n' "$body" > release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "$title" \
            --notes-file release-notes.md
