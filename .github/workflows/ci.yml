name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Nucleo puro (pytest + pyflakes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - run: pip install -r requirements_test.txt

      # La suite copre solo i moduli che non importano Home Assistant: è
      # deliberato, vedi tests/conftest.py.
      - name: pytest
        run: python -m pytest

      # pyflakes lavora sull'AST e non esegue nulla, quindi arriva anche dove
      # l'import fallirebbe: i moduli che dipendono da Home Assistant e lo
      # script diagnostico, che dipende da OWNd. Nessuno dei due è installato
      # qui, ed è il motivo per cui questo controllo esiste.
      - name: pyflakes
        run: python -m pyflakes custom_components/ctha tests diagnostics

  frontend:
    name: Pannello (build + smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # `npm run check` fa tsc, il build Vite e il monta-e-verifica in jsdom.
      - name: npm run check
        run: npm run check

      # Il bundle compilato è versionato, perché HACS distribuisce il
      # repository così com'è: se `npm run check` lo ha cambiato, vuol dire che
      # è stato committato un sorgente senza il bundle rifatto, e chi installa
      # da HACS si ritroverebbe il pannello vecchio.
      - name: Il bundle committato è aggiornato
        run: |
          if ! git diff --exit-code -- ../custom_components/ctha/frontend/ctha-panel.js; then
            echo "::error::Il bundle in custom_components/ctha/frontend/ è disallineato dai sorgenti in frontend/src/. Esegui 'cd frontend && npm run check' e committa anche il bundle."
            exit 1
          fi
